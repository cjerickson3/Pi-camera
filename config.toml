# Pi-camera configuration. All tunables live here; picam/config.py has the
# defaults and validation. Unknown keys are an error, so typos fail loudly.

[camera]
# Which camera: "tapo" (Tapo C120 over RTSP, see [tapo]; since 2026-11-21) or "picam"
# (Camera Module 2 NoIR on the Zero's CSI port; the settings below are for it). Switching
# back also needs the picam detection area in [motion].
source = "tapo"
tuning = "imx219_noir.json"     # NoIR tuning; the default imx219.json wipes out IR at night
sensor_mode = [1640, 1232]      # 2x2 binned: full field of view, better low light
main_size = [1280, 960]         # recorded H.264 stream
lores_size = [320, 240]         # motion-detection stream (Y plane only is used)
fps = 15
max_exposure_ms = 66.7          # cap; 66.7 ms holds 15 fps. 133 = brighter but 7.5 fps and more blur
bitrate = 3_000_000
greyscale = true                # NoIR night colours carry no information

[motion]
# A detector pixel (lores downscaled 2x to 160x120) "changed" if it differs
# from the running background by more than pixel_threshold (0-255 luma).
pixel_threshold = 12
# Fraction of the detection area that must change for a frame to count as motion.
# 0.01 of the area below is ~17 detector pixels; a 2" head at the hole is ~65.
min_area = 0.01
# Speck filter: a changed pixel survives only if at least this many of its 3x3
# neighbourhood (itself included) also changed. Kills sensor noise and rain specks.
min_neighbours = 4
background_alpha = 0.05         # how fast the background adapts (per frame)
lighting_change = 0.5           # >50% of the whole frame changing at once = lighting, not motion
# Also lighting: the frame's mean brightness moving >15% from the background's. Catches a
# lamp that lights the grass but not the dark sidewalk (illuminator off at dawn 2026-11-20
# 06:43: 96 -> 57, under half the frame changed, and it scored ~0.6 for 12 s).
brightness_jump = 0.15
# Frames to learn the background after start or a lighting change. The background follows
# the scene during warm-up, which restarts while brightness still moves >3%/frame
# (brightness_jump / 5), e.g. AE settling at start (18:22 nightly scored ~0.7 for 17 s).
warmup_frames = 30
trigger_frames = 3              # consecutive motion frames needed to start a clip

# Detection area as [x0, y0, x1, y1] fractions of the frame (0,0 = top left).
# Motion is only counted inside `include` and outside `exclude`.
# Check placement with: python3 tools/aim.py (rectangles are drawn on the view).
# Tapo C120, 2026-11-21: on a pole 1 ft from the hole horizontally, 2 ft up, looking
# straight down at it. Sidewalk on the left, the mulch strip along its edge, lawn on the
# right. The hole is the dark gap in the mulch at about (0.50-0.55, 0.35-0.50). The area
# is the sidewalk edge, the mulch strip and the near grass. The camera's burned-in clock
# (top left, changes every second) is outside it.
include = [[0.40, 0.12, 0.70, 0.88]]
exclude = []
# Pi camera (source = "picam"), 2026-11-16: hole against the sidewalk edge ~1" left of the
# ruler at about (0.52-0.56, 0.42-0.47); a ~12" x 10" patch around it:
# include = [[0.40, 0.33, 0.72, 0.60]]

[tapo]
# Tapo C120 over RTSP (Advanced Settings > Camera Account in the Tapo app). The IP, user
# and password are in .env (TAPO_HOST, TAPO_USER, TAPO_PASSWORD), never in this file.
port = 554
motion_stream = "stream2"       # 640x360 H.264, 20 fps: decoded for motion detection
record_stream = "stream1"       # 2560x1440 H.264: copied into clips without re-encoding (ffmpeg)
motion_size = [320, 180]        # stream2 scaled to this for the detector
detect_fps = 10                 # frames/s given to the detector (stream2 is decoded in full)
# stream1 is cut into pieces of about this length (at keyframes, every ~2 s on the C120)
# in ring_dir (RAM). Clips are made from these pieces, so their ends round out to them.
segment_s = 2
ring_dir = "/dev/shm/picam-tapo"
stall_s = 10                    # no data for this long = connection lost: reconnect
ffmpeg = "ffmpeg"

[clips]
preroll_s = 5
postroll_s = 5                  # stop this long after the last motion
max_clip_s = 60

[schedule]
latitude = 33.02
longitude = -96.70
timezone = "America/Chicago"
start_after_sunset_min = 60
stop_after_sunrise_min = -30    # negative = before sunrise; dawn light is not IR footage

[pir]
enabled = false                 # hook for a PIR sensor later (gpiozero MotionSensor)
gpio_pin = 17                   # BCM numbering

[retention]
# Pruned at startup and when the night window opens. Starred clips are never
# deleted; pruned events keep their database row (clip/snapshot set to empty).
keep_nights = 30                # delete unstarred clips from nights older than this
min_free_gb = 10                # and then oldest nights first until this much is free

[review]
# Clip review page (python3 -m picam.review). Localhost only; `tailscale serve`
# publishes it on the tailnet as http://zero/ (see docs/pi-setup.md).
bind = "127.0.0.1"
port = 8080

[paths]
data_dir = "~/picam-data"
